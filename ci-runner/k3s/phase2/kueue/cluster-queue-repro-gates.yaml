# cluster-queue-repro-gates.yaml — the REPRODUCTION lane for gate Jobs: one
# gate's worth of quota on gamingpc-xubuntu, kept apart from gates-cq so an
# operator can run one diagnosed full-suite gate there while gates-cq's own
# gamingpc lane stays held at zero (livespec-dev-tooling-pkmxgu, plan
# gate-job-resources; the hold is livespec-dev-tooling#4210 and the hang it
# guards against is livespec-dev-tooling-ddy5xu).
#
# NOTHING ORDINARY CAN REACH THIS QUEUE. A gate Job lands in the LocalQueue its
# `kueue.x-k8s.io/queue-name` label names, and render-gate-job.sh writes
# `gates-lq` there unless it is told `--queue`. Only the operator route passes
# it: `just gate-repro` runs `python -m livespec_dev_tooling.gate_repro`, which
# submits through the normal gate client (mirror push, `kubectl create` of a
# rendered Job, poll, delete on abandonment), never a hand `kubectl create`.
# Pre-push and pre-commit delegation never name this queue, so held means held
# for every gate a push or a commit sends.
#
# THE FLAVOR PINS THE NODE. Its `nodeLabels` select gamingpc-xubuntu by
# hostname, exactly as gates-gamingpc-flavor does, and it names the same
# `gates-hostname` Topology, so Kueue admits a repro gate only when that node
# has free requests for it, the same topology-aware admission gates-cq uses.
# It is a SEPARATE flavor because a ResourceFlavor's quota is per ClusterQueue
# and this queue must hold quota where gates-cq holds none.
#
# DELIBERATELY NOT IN cluster-queue-gates.yaml. The readers of that file treat
# every ResourceFlavor in it as a fleet gate lane: the ci_pool lane test maps
# each one to a ci_pool host, the gate-unit test counts its quota in whole
# gate units, and the lane-order reconciler and converge-worker-queues.sh
# reorder and extend gates-cq's flavor list. A reproduction lane is none of
# those things. The converge still applies it, because
# ../reconstruct/converge-ci-stack.sh step 5 and
# ../reconstruct/install-converge-unit.sh both loop `cluster-queue-*.yaml`.
#
# SAME SHAPE AS cluster-queue-phase1-proof.yaml: a flavor, a ClusterQueue and a
# LocalQueue in one file, with no `cohortName` (it neither lends nor borrows),
# quota'd on plain cpu/memory rather than on `ci-runner.io/churn-slot`, so it
# is outside DERIVATION.md's churn-slot apportionment.
#
# THE NAME IS LOAD-BEARING. This file needs two objects
# cluster-queue-gates.yaml declares, the `gates` Namespace (its LocalQueue
# lives there, and applying a LocalQueue into a missing namespace FAILS under
# step 5's `set -e`) and the `gates-hostname` Topology. The converge loop takes
# the glob in sorted order, and `cluster-queue-repro-gates.yaml` sorts after
# `cluster-queue-gates.yaml` in both the C and UTF-8 collations, while the
# first-draft name `cluster-queue-gates-repro.yaml` sorted BEFORE it in both.
#
# PER-NODE FLAVORS (livespec-dev-tooling-cwrg3v). This queue now holds one
# flavor per ARMED gate node (poweredge, gmktec), each pinned by its
# hostname nodeLabel. The gamingpc and hp flavors were RETIRED
# (livespec-dev-tooling-nkocp5, plan gate-job-resources, spec v261): both
# sat at zero, and the converge deletes the two ResourceFlavors
# (converge-ci-stack.sh step 5, after the queue apply). A node without a
# flavor here has no repro lane: `just gate-repro --node <node>` refuses it at
# submit, naming the missing flavor. To re-arm one, add its flavor and its
# node-cpu-budget.yaml repro_cpu in one pull request. `just gate-repro --node <node>` renders a required
# hostname nodeSelector on the Job, and Kueue assigns only the flavor whose
# nodeLabels agree with it, so the Job is admitted through that node's quota and
# runs only there. Each flavor here is armed (poweredge-xubuntu and
# gmktec-xubuntu): arming a further node means adding ITS flavor at one gate
# unit in a separate pull request, which belongs
# to plan gate-job-resources' per-node CPU budget (a repro gate is a second
# 5 cpu / 8Gi claim on a node whose budget does not count it), and reverting
# that pull request disarms it. READERS of these values, checked before this
# change: the ci_pool lane test, the gate-unit test, the lane-order reconciler
# and converge-worker-queues.sh all read cluster-queue-gates.yaml only, so none
# sees this file's flavors.
#
# RETIRE this file once ddy5xu has named and fixed the hung step and
# gates-gamingpc-flavor has its 5 / 8Gi back: then an ordinary gate reaches
# gamingpc and a separate lane has nothing left to reproduce.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gates-repro-poweredge-flavor
spec:
  nodeLabels:
    kubernetes.io/hostname: poweredge-xubuntu
  topologyName: gates-hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gates-repro-gmktec-flavor
spec:
  nodeLabels:
    kubernetes.io/hostname: gmktec-xubuntu
  topologyName: gates-hostname
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gates-repro-cq
spec:
  namespaceSelector: {}
  # The pool's three settings, stated for the same reason gates-cq states
  # them: a reproduction gate never evicts anything.
  preemption:
    reclaimWithinCohort: Never
    borrowWithinCohort:
      policy: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory", "ephemeral-storage"]
      # EPHEMERAL-STORAGE IS COVERED (2026-11-22, plan gate-job-resources, tsde55
      # ordering fix). A Workload that requests a resource no resource group
      # covers is NEVER admitted ("resource ephemeral-storage unavailable in
      # ClusterQueue"), and a repro Job is the same gate Job, so on 2026-11-21 one gate Job
      # that requested ephemeral-storage held every later gate in the fleet Pending
      # for about 20 minutes. ORDER: this manifest is applied through the committed
      # converge BEFORE any gate client requests ephemeral-storage. Each flavor's
      # ephemeral-storage quota is its concurrent repro gate count x the 2560Mi gate
      # request (peak 1.62 GiB measured 2026-11-21 x 1.25, rounded up to 0.5 GiB;
      # ci-runner/k3s/phase2/EPHEMERAL-STORAGE.md on tsde55). Allocatable read
      # 2026-11-22: gmktec-xubuntu 434.4 GiB, hp-xubuntu 411.5 GiB, poweredge-xubuntu
      # 186.0 GiB, gamingpc-xubuntu unreadable (NotReady), so no quota exceeds a
      # node's disk. The pre-submit check in the gate client now refuses a Job whose
      # requests this list does not cover.
      flavors:
        - name: gates-repro-poweredge-flavor
          resources:
            # ARMED: ONE gate unit (5 cpu / 8Gi, gates-cq's gate-unit
            # annotations), by the coordinator's and maintainer's ARM RULING
            # under the per-node CPU budget (plan gate-job-resources,
            # livespec-dev-tooling-cwrg3v). Basis: the most headroom of the fleet (about 18 cores idle at 07:14Z).
            # REVERT TRIGGER: BestEffort cpu.pressure avg60 over 30 on two reads
            # on this node. REVERT PATH: revert the arming pull request, which
            # restores zero.
            #
            # RAISED 5 -> 10 cpu 2026-11-19 (livespec-dev-tooling-z66x7t;
            # throughput-plans-coordinator request), for the same reason as
            # gmktec and hp below: a repo declaring gate_cpu = 10 (the
            # orchestrator) asks 10 cpu, and a 5-cpu flavor can never admit it
            # (the shellcheck OOM repro sdl8f read "insufficient quota" with no
            # other workload on the node). Read before raising: poweredge
            # BestEffort cpu.pressure avg60 0.26 and 0.19 on two reads, 72
            # threads. The same revert trigger applies; to undo only this raise,
            # set cpu back to 5.
            - name: "cpu"
              nominalQuota: 10
            - name: "memory"
              nominalQuota: 8Gi
            - name: "ephemeral-storage"
              nominalQuota: 5Gi
        - name: gates-repro-gmktec-flavor
          resources:
            # ARMED: ONE gate unit (5 cpu / 8Gi, gates-cq's gate-unit
            # annotations), by the coordinator's and maintainer's ARM RULING
            # under the per-node CPU budget (plan gate-job-resources,
            # livespec-dev-tooling-cwrg3v). Basis: 66 percent busy at 07:14Z, so the HEADROOM RISK is the largest here.
            # REVERT TRIGGER: BestEffort cpu.pressure avg60 over 30 on two reads
            # on this node. REVERT PATH: revert the arming pull request, which
            # restores zero.
            #
            # RAISED 5 -> 10 cpu 2026-11-19 (livespec-dev-tooling-z66x7t;
            # throughput-plans-coordinator no-objection). The orchestrator's gate
            # declares gate_cpu = 10, so its repro Job asks 10 cpu and a 5-cpu
            # flavor can never admit it: Kueue said "insufficient quota for cpu
            # in flavor gates-repro-gmktec-flavor" for the cthvom probe, the same
            # reason hp was raised to 10. Memory stays 8Gi (the Job asks 8Gi).
            # Read before raising: gmktec BestEffort cpu.pressure avg60 0.00 on
            # two reads and the node 19 percent busy, 32 allocatable cpu. The
            # same revert trigger applies; to undo only this raise, set cpu back
            # to 5. gmktec carries factory pods, so a tripped trigger also cuts
            # the fleet cap.
            # LOWERED 10 -> 5 cpu 2026-11-19 (plan gate-job-resources, livespec-dev-tooling-
            # wirn53; throughput-plans-coordinator ruling R301). A 10 cpu quota admits
            # TWO concurrent 5 cpu repro Jobs and a gate Job has no cpu limit: that
            # is the shape that overcommitted hp-xubuntu on 2026-11-19 (two repro Jobs
            # at 15.38 and 10.96 cpu beside two factory sandboxes). gmktec carries
            # factory pods, where the cpu.pressure avg60 tripwire cuts the fleet cap,
            # so it holds ONE 5 cpu unit. A gate_cpu = 10 repository (the orchestrator)
            # therefore reproduces only on poweredge, whose 72 allocatable cpu absorbs
            # two bursting units; do not raise gmktec back to 10 for it. REVERT PATH:
            # revert this pull request, which restores 10 cpu / 8Gi.
            - name: "cpu"
              nominalQuota: 5
            - name: "memory"
              nominalQuota: 8Gi
            - name: "ephemeral-storage"
              nominalQuota: 2560Mi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: gates-repro-lq
  namespace: gates
spec:
  clusterQueue: gates-repro-cq
